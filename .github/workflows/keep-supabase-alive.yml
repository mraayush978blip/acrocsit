name: Keep Supabase Projects Alive

on:
  schedule:
    # Runs at 00:00 every 3 days to prevent 7-day inactivity pause
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Primary Supabase Project
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://rgowcovsultizysqwrff.supabase.co/rest/v1/branches?limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnb3djb3ZzdWx0aXp5c3F3cmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2MTUzNjgsImV4cCI6MjA4NjE5MTM2OH0.XsLY-ff_JwabjTDKhmykWvE3XiMULjPXBkLlyiMIYxw" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnb3djb3ZzdWx0aXp5c3F3cmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2MTUzNjgsImV4cCI6MjA4NjE5MTM2OH0.XsLY-ff_JwabjTDKhmykWvE3XiMULjPXBkLlyiMIYxw")
          echo "Primary project HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Warning: unexpected status $STATUS" && exit 1)

      - name: Ping 2nd Year Supabase Project
