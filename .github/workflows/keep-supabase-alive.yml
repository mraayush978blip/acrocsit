            "https://mxbxdtiviuejjwxvqetg.supabase.co/rest/v1/branches?limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YnhkdGl2aXVlamp3eHZxZXRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNjM5NjIsImV4cCI6MjA4OTczOTk2Mn0.JvK3K_7JwrkjEwgYLhoYLbFQVevfw-9LU45iUnnhhOE" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14YnhkdGl2aXVlamp3eHZxZXRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNjM5NjIsImV4cCI6MjA4OTczOTk2Mn0.JvK3K_7JwrkjEwgYLhoYLbFQVevfw-9LU45iUnnhhOE")
          echo "2nd Year project HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Warning: unexpected status $STATUS" && exit 1)

      - name: Ping 4th Year Supabase Project
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ghmwyxpmdiafvjagjfqc.supabase.co/rest/v1/branches?limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdobXd5eHBtZGlhZnZqYWdqZnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjc4NjgsImV4cCI6MjEwMTYwMzg2OH0.uNEo7rMENGMYhIU9WhTxCACRH7-6Usef-PGlFLPFO8A" \
